[env:esp32-s3-devkitc-1-n16r8]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; AITRIP ESP32-S3-DevKitC-1-N16R8 Memory Configuration (16MB Quad Flash + 8MB Octal PSRAM)
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=0

lib_deps =
    paulstoffregen/OneWire@^2.3.8
    milesburton/DallasTemperature@^3.11.0

; Ignore macOS AppleDouble (._*) files on external volume
build_src_filter =
    +<*>
    -<._*>

upload_port = /dev/cu.usbmodem5CE51967211
upload_speed = 921600
monitor_port = /dev/cu.usbmodem5CE51967211
monitor_speed = 115200
