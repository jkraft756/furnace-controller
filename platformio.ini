[env:esp32-s3-devkitc-1-n16r8]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; AITRIP ESP32-S3-DevKitC-1-N16R8 Memory Configuration (16MB Quad Flash, PSRAM disabled due to damaged AP_3v3 PSRAM on 14:C1:9F:C9:2C:00)
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv
board_build.flash_mode = qio

build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=0

lib_deps =
    paulstoffregen/OneWire@^2.3.8
    milesburton/DallasTemperature@^3.11.0

; Ignore macOS AppleDouble (._*) files on external volume
build_src_filter =
    +<*>
    -<._*>

upload_port = /dev/cu.usbmodem5CE51935921
upload_speed = 921600
monitor_port = /dev/cu.usbmodem5CE51935921
monitor_speed = 115200
